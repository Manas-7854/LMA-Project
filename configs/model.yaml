# LLM profiles. Controlled comparisons must all use one profile.
qwen3_8b_vllm:            # target model from the proposal; needs a GPU server
  backend: openai
  model: Qwen/Qwen3-8B
  revision: null          # pin the HF commit hash at first download
  base_url: http://localhost:8000/v1
  temperature: 0.0
  top_p: 1.0
  max_tokens: 512
  seed: 13
  extra:
    chat_template_kwargs: {enable_thinking: false}   # proposal: non-thinking mode

smoke_qwen25_05b_cpu:     # pipeline smoke tests only; never used for reported results
  backend: hf
  model: Qwen/Qwen2.5-0.5B-Instruct
  revision: null
  temperature: 0.0
  max_tokens: 160
  seed: 13

mock:                     # deterministic stub: always "true", cites first passage
  backend: mock
  model: mock

mock_scifact:             # role-routed SciFact stub (src/oblig/llm/mock_scifact.py); pipeline tests only
  backend: mock
  model: mock_scifact
