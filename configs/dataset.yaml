pubhealth:
  root: data/PUBHEALTH
  splits: [train, dev, test]          # official splits, unchanged
  labels: [true, false, mixture, unproven]
  model_inputs: [claim]               # evidence comes only via retrieval over masked main_text
  forbidden_inputs: [label, explanation, claim_id, fact_checkers, subjects, sources, date_published]
scifact:
  root: data/raw/scifact/data
  labels: [SUPPORTS, REFUTES, NEI]
  note: claims_test.jsonl is unlabelled; claims_dev.jsonl serves as the held-out evaluation set
